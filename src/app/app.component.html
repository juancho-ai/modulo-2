<RadSideDrawer [drawerTransition]="sideDrawerTransition">
  <GridLayout tkDrawerContent rows="auto, *" class="nt-drawer__content">
    <StackLayout row="0" class="sidedrawer-header">
      <Image src="res://ic_catalogo_custom" width="48" height="48" horizontalAlignment="left"></Image>
      <Label class="sidedrawer-header-brand" text="Proyecto Modular NG"></Label>
      <Label class="sidedrawer-header-footnote" text="Formularios, Animaciones y Gestos"></Label>
    </StackLayout>

    <ScrollView row="1" class="nt-drawer__body">
      <StackLayout>
        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/search')" (tap)="onNavItemTap('/search')">
          <Label col="0" text="&#xf002;" class="nt-icon fas"></Label>
          <Label col="1" text="Búsqueda (ListView + PullRefresh)" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/catalogo')" (tap)="onNavItemTap('/catalogo')">
          <Image col="0" src="res://ic_catalogo_custom" width="22" height="22" marginRight="12"></Image>
          <Label col="1" text="Catálogo (Feature)" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/home')" (tap)="onNavItemTap('/home')">
          <Label col="0" text="&#xf015;" class="nt-icon fas"></Label>
          <Label col="1" text="Home" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/browse')" (tap)="onNavItemTap('/browse')">
          <Label col="0" text="&#xf1ea;" class="nt-icon far"></Label>
          <Label col="1" text="Browse" class="p-r-10"></Label>
        </GridLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/featured')" (tap)="onNavItemTap('/featured')">
          <Label col="0" text="&#xf005;" class="nt-icon fas"></Label>
          <Label col="1" text="Featured" class="p-r-10"></Label>
        </GridLayout>

        <StackLayout class="hr m-y-10"></StackLayout>

        <GridLayout columns="auto, *" class="sidedrawer-list-item" [class.-selected]="isComponentSelected('/settings')" (tap)="onNavItemTap('/settings')">
          <Label col="0" text="&#xf013;" class="nt-icon fas"></Label>
          <Label col="1" text="Settings" class="p-r-10"></Label>
        </GridLayout>
      </StackLayout>
    </ScrollView>
  </GridLayout>

  <page-router-outlet tkMainContent></page-router-outlet>
</RadSideDrawer>
