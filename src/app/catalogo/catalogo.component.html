<ActionBar class="action-bar">
  <NavigationButton ios:visibility="collapsed" icon="res://menu" (tap)="onDrawerButtonTap()"></NavigationButton>
  <ActionItem icon="res://menu" android:visibility="collapsed" (tap)="onDrawerButtonTap()" ios.position="left"></ActionItem>
  <Label text="Catálogo Modular"></Label>
</ActionBar>

<ScrollView>
  <StackLayout class="page-container">
    <GridLayout columns="auto, *" class="banner-plataforma">
      <Image col="0" src="res://ic_catalogo_custom" width="40" height="40" class="banner-icon"></Image>
      <StackLayout col="1" verticalAlignment="center">
        <Label text="Módulo Feature: Catálogo" class="banner-titulo"></Label>
        <Label [text]="mensajePlataforma" textWrap="true" class="banner-subtitulo"></Label>
      </StackLayout>
    </GridLayout>

    <Label text="Toca un elemento para editarlo en la vista de detalle:" class="section-heading"></Label>

    <StackLayout *ngFor="let item of listaItems" class="tarjeta-item" (tap)="verDetalle(item.id)">
      <GridLayout columns="*, auto">
        <Label col="0" [text]="item.nombre" class="item-titulo"></Label>
        <Label col="1" [text]="'$' + item.precio" class="item-precio"></Label>
      </GridLayout>
      <Label [text]="item.categoria" class="item-categoria"></Label>
      <Label [text]="item.descripcion" textWrap="true" class="item-descripcion"></Label>
    </StackLayout>
  </StackLayout>
</ScrollView>
